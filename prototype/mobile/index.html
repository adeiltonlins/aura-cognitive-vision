<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AURA Mobile Vision</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050812;color:#eef3ff;font-family:system-ui,sans-serif;overflow:hidden}.app{height:100dvh;position:relative;background:#000}.camera{width:100%;height:100%;object-fit:cover}.hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:env(safe-area-inset-top,16px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}.badge,.panel{background:rgba(5,8,18,.72);border:1px solid rgba(150,180,255,.2);backdrop-filter:blur(10px);border-radius:14px;padding:10px 13px}.status{color:#83e6ac;font-size:12px}.title{font-weight:700}.bottom{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,16px) + 16px);display:flex;justify-content:center}.button{pointer-events:auto;border:0;border-radius:999px;padding:15px 24px;font-weight:700;font-size:16px}.panel{position:absolute;left:16px;right:16px;bottom:100px;font-size:13px;display:none}.panel.show{display:block}.hint{opacity:.72;margin-top:5px}.cross{position:absolute;left:50%;top:50%;width:36px;height:36px;transform:translate(-50%,-50%);opacity:.5}.cross:before,.cross:after{content:"";position:absolute;background:#fff}.cross:before{width:36px;height:1px;top:18px}.cross:after{height:36px;width:1px;left:18px}</style>
</head><body><main class="app"><video id="camera" class="camera" autoplay playsinline muted></video><div class="hud"><div class="top"><div class="badge"><div class="title">👁️ AURA</div><div class="status">● MOBILE VISION</div></div><div id="connection" class="badge">OFFLINE</div></div><div class="cross"></div><div id="panel" class="panel"><b>Percepção</b><div id="result">Aguardando câmera...</div><div class="hint">A câmera permanece no dispositivo; análise remota será conectada pelo backend.</div></div><div class="bottom"><button id="start" class="button">Ativar câmera</button></div></div></main><script>
const video=document.getElementById('camera'), start=document.getElementById('start'), panel=document.getElementById('panel'), result=document.getElementById('result'), connection=document.getElementById('connection');
start.onclick=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;start.textContent='Câmera ativa';panel.classList.add('show');connection.textContent='CAMERA READY';connection.style.color='#83e6ac';result.textContent='Captura iniciada. Próximo passo: enviar frames selecionados ao AURA.'}catch(e){result.textContent='Não foi possível acessar a câmera: '+e.message;panel.classList.add('show')}};
</script></body></html>
